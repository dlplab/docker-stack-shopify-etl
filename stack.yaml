    container_name: shopify-etl
    ports:
      - "3002:3002"
    environment:
      - SHOPIFY_STORE_DOMAIN=${SHOPIFY_STORE_DOMAIN}
      - SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-2025-10}
      - SHOPIFY_ADMIN_ACCESS_TOKEN=${SHOPIFY_ADMIN_ACCESS_TOKEN}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGSSLMODE=${PGSSLMODE:-prefer}
      - PGSSL_REJECT_UNAUTHORIZED=${PGSSL_REJECT_UNAUTHORIZED:-true}
      - PGSSLROOTCERT=/etc/ssl/dlplab-root-ca.pem
      - TZ=${TZ:-Australia/Brisbane}
      - ETL_SCHEDULE=0 * * * *
      - RUN_ON_STARTUP=false
      - ETL_PORT=3002
      # Database initialization settings
      - RUN_DB_INIT=${RUN_DB_INIT:-false}
      - DB_ADMIN_USER=${DB_ADMIN_USER:-postgres}
      - DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD}
      - DB_ADMIN_DB=${DB_ADMIN_DB:-postgres}
      - DB_ADMIN_ROLE_PASSWORD=${DB_ADMIN_ROLE_PASSWORD}
      - DB_LOADER_PASSWORD=${DB_LOADER_PASSWORD}
      - DB_N8N_PASSWORD=${DB_N8N_PASSWORD}
    volumes:
      - /data/compose/shopify-etl/certs/dlplab-root-ca.pem:/etc/ssl/dlplab-root-ca.pem:ro
    restart: unless-stopped
    networks:
      - shopify-network